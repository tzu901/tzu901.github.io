            function setRasterLayerVisibility(layer, visible) {
                if (!layer || !layer._container) return;
                layer._container.style.display = visible ? "" : "none";
                layer._container.style.pointerEvents = visible ? "" : "none";
            }

            var RasterVisibilityProxy = L.Layer.extend({
                initialize: function() {
                    this._rasterLayer = null;
                    this._visible = false;
                },
                onAdd: function(map) {
                    this._map = map;
                    this._visible = true;
                    if (this._rasterLayer) {
                        if (!map.hasLayer(this._rasterLayer)) map.addLayer(this._rasterLayer);
                        setRasterLayerVisibility(this._rasterLayer, true);
                    }
                },
                onRemove: function() {
                    this._visible = false;
                    setRasterLayerVisibility(this._rasterLayer, false);
                    this._map = null;
                },
                attachRaster: function(layer) {
                    this._rasterLayer = layer;
                    if (this._map && !this._map.hasLayer(layer)) this._map.addLayer(layer);
                    setRasterLayerVisibility(layer, this._visible);
                }
            });

            function createRasterVisibilityProxy() {
                return new RasterVisibilityProxy();
            }
