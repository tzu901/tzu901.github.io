            function chm_2026_hex_to_rgb(hex) {
                return {
                    r: parseInt(hex.slice(1, 3), 16),
                    g: parseInt(hex.slice(3, 5), 16),
                    b: parseInt(hex.slice(5, 7), 16)
                };
            }

            function chm_2026_viridis_color(normalized) {
                var scaled = normalized * (chm_2026_viridis_stops.length - 1);
                var lowerIndex = Math.floor(scaled);
                var upperIndex = Math.min(lowerIndex + 1, chm_2026_viridis_stops.length - 1);
                var fraction = scaled - lowerIndex;
                var lower = chm_2026_hex_to_rgb(chm_2026_viridis_stops[lowerIndex]);
                var upper = chm_2026_hex_to_rgb(chm_2026_viridis_stops[upperIndex]);
                var red = Math.round(lower.r + (upper.r - lower.r) * fraction);
                var green = Math.round(lower.g + (upper.g - lower.g) * fraction);
                var blue = Math.round(lower.b + (upper.b - lower.b) * fraction);
                return "rgba(" + red + "," + green + "," + blue + ",1)";
            }

            function chm_2026_format_height(value) {
                return Number(value).toFixed(Number(value) >= 10 ? 1 : 2) + " m";
            }

            function chm_2026_color(values, min, max, noDataValue) {
                var value = values && values[0];
                if (!Number.isFinite(value) || value <= 0 || (noDataValue !== null && value === noDataValue)) {
                    return "rgba(0,0,0,0)";
                }
                var normalized = (value - min) / (max - min || 1);
                normalized = Math.max(0, Math.min(1, normalized));
                return chm_2026_viridis_color(normalized);
            }

                    var noDataValue = georaster.noDataValue;
                    chm_2026_layer = new GeoRasterLayer({
                        georaster: georaster,
                        opacity: chm_2026_opacity,
                        pixelValuesToColorFn: function(values) {
                            return chm_2026_color(values, min, max, noDataValue);
                        },
                        resolution: 256,
                        resampleMethod: "bilinear"
                    });
